<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevFill QA Auto-Filler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      width: 320px;
      background-color: #141414;
      color: #F3F3F1;
      padding: 12px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #262626;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 24px;
      height: 24px;
      background: #FFB800;
      color: #121212;
      font-weight: 900;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      color: #F3F3F1;
    }
    .brand-sub {
      font-size: 10px;
      color: #888884;
    }
    .settings-btn {
      background: #222222;
      border: 1px solid #333333;
      color: #A3A3A0;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .settings-btn:hover {
      background: #2C2C2C;
      color: #F3F3F1;
    }
    .card {
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: #888884;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .email-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #121212;
      border: 1px solid #282828;
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
    }
    .email-box:hover {
      border-color: rgba(255, 184, 0, 0.5);
    }
    .email-text {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      color: #FFB800;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy-hint {
      font-size: 10px;
      color: #777777;
    }
    .btn-main {
      width: 100%;
      background: #FFB800;
      color: #121212;
      font-weight: 700;
      font-size: 12px;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
      transition: background 0.15s;
    }
    .btn-main:hover {
      background: #E5A600;
    }
    .btn-secondary {
      width: 100%;
      background: #202020;
      color: #F3F3F1;
      border: 1px solid #333333;
      font-size: 11px;
      padding: 7px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #282828;
    }
    .status-msg {
      font-size: 11px;
      color: #00D084;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
    .footer {
      font-size: 10px;
      color: #6E6E6A;
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #222222;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">⚡</div>
      <div>
        <div class="brand-title">DevFill</div>
        <div class="brand-sub">QA Form Auto-Filler</div>
      </div>
    </div>
    <button id="openOptions" class="settings-btn">⚙ Settings</button>
  </div>

  <div class="card">
    <div class="card-label">
      <span>Dynamic Test Email</span>
      <span id="dateSuffixTag" style="color:#FFB800; font-family: monospace;">+DDMMYYYY</span>
    </div>
    <div id="copyEmailBox" class="email-box" title="Click to copy dynamic test email">
      <span id="dynamicEmailDisplay" class="email-text">user+test...</span>
      <span id="copyFeedback" class="copy-hint">Copy</span>
    </div>
  </div>

  <button id="fillFormBtn" class="btn-main">
    <span>⚡ Fill Form with Test Data</span>
  </button>

  <button id="fillFocusedBtn" class="btn-secondary">
    🎯 Fill Focused Input Only
  </button>

  <div id="statusMsg" class="status-msg"></div>

  <div class="footer">
    <span>Shortcut: Alt+Shift+F</span>
    <span style="color:#888;">Manifest V3</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>

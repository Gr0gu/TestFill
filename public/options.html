<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevFill Settings & Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #121212;
      color: #F3F3F1;
      padding: 36px 20px;
      display: flex;
      justify-content: center;
      font-size: 15px;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: #141414;
      border: 1px solid #282828;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #262626;
      padding-bottom: 18px;
      margin-bottom: 22px;
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      background: #FFB800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-badge svg {
      width: 20px;
      height: 20px;
      fill: #121212;
      stroke: #121212;
    }
    .title { font-size: 18px; font-weight: 700; color: #F3F3F1; }
    .subtitle { font-size: 13px; color: #888884; margin-top: 2px; }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #FFB800;
      letter-spacing: 0.6px;
      margin: 22px 0 14px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title svg {
      width: 16px;
      height: 16px;
      stroke: #FFB800;
    }
    .form-group { margin-bottom: 14px; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #D4D4D0;
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      background: #1A1A1A;
      border: 1px solid #2E2E2E;
      color: #F3F3F1;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input:focus { border-color: #FFB800; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .email-preview {
      background: #181818;
      border: 1px solid #2C2C2C;
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .email-preview-val { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; color: #FFB800; font-weight: 600; }
    .save-bar {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #262626;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-save {
      background: #FFB800;
      color: #121212;
      font-weight: 700;
      font-size: 14px;
      border: none;
      padding: 10px 22px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-save:hover { background: #E5A600; }
    .save-status { font-size: 13px; color: #00D084; font-weight: 600; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <div>
        <div class="title">DevFill Extension Settings</div>
        <div class="subtitle">Configure default test profile data and dynamic date suffixes</div>
      </div>
    </div>

    <form id="settingsForm">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        <span>Email & Dynamic Date Suffix</span>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="label">Base Work Email</label>
          <input type="email" id="baseEmail" class="input" required placeholder="user@company.com">
        </div>
        <div class="form-group">
          <label class="label">Date Suffix Format</label>
          <select id="dateSuffixFormat" class="input">
            <option value="DDMMYYYY">DDMMYYYY (e.g. 18082026)</option>
            <option value="YYYYMMDD">YYYYMMDD (e.g. 20260818)</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD (e.g. 2026-08-18)</option>
            <option value="DD-MM-YYYY">DD-MM-YYYY (e.g. 18-08-2026)</option>
          </select>
        </div>
      </div>

      <div class="email-preview">
        <div>
          <span style="font-size: 11px; color: #888; text-transform: uppercase; font-weight: 600;">Computed Dynamic Test Email:</span>
          <div id="emailPreviewDisplay" class="email-preview-val">user+test...</div>
        </div>
      </div>

      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Default Test Profile Data</span>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="label">First Name</label>
          <input type="text" id="firstName" class="input" placeholder="Alex">
        </div>
        <div class="form-group">
          <label class="label">Last Name</label>
          <input type="text" id="lastName" class="input" placeholder="Morgan">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="label">Phone Number</label>
          <input type="tel" id="phone" class="input" placeholder="+1 (555) 234-5678">
        </div>
        <div class="form-group">
          <label class="label">Street Address</label>
          <input type="text" id="streetAddress" class="input" placeholder="742 Evergreen Terrace">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="label">City</label>
          <input type="text" id="city" class="input" placeholder="San Francisco">
        </div>
        <div class="form-group">
          <label class="label">ZIP / Postal Code</label>
          <input type="text" id="zipCode" class="input" placeholder="94107">
        </div>
      </div>

      <div class="form-group">
        <label class="label">Country</label>
        <input type="text" id="country" class="input" placeholder="United States">
      </div>

      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Execution Controls</span>
      </div>
      <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="enableFloatingTrigger" style="width: 16px; height: 16px; accent-color: #FFB800; cursor: pointer;">
        <label for="enableFloatingTrigger" class="label" style="margin: 0; cursor: pointer;">Enable in-page floating auto-fill badge</label>
      </div>

      <div class="save-bar">
        <span id="saveStatus" class="save-status">Settings saved successfully!</span>
        <button type="submit" class="btn-save">Save Settings</button>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
